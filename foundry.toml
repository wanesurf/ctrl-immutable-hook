[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_remappings = false
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fuzz.runs = 512
invariant.runs = 128
invariant.depth = 64

[rpc_endpoints]
robinhood_mainnet = "${RH_MAINNET_RPC_URL}"
robinhood_testnet = "${RH_TESTNET_RPC_URL}"
